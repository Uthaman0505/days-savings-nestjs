# Branch model: `development` = integration/dev, `master` = production.
name: CI

on:
  pull_request:
    branches:
      - master
      - development
  push:
    branches:
      - master
      - development

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: luno_ci
          POSTGRES_PASSWORD: luno_ci_test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U luno_ci -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LUNO_TEST_PGHOST: 127.0.0.1
      LUNO_TEST_PGPORT: '5432'
      LUNO_TEST_PGUSER: luno_ci
      LUNO_TEST_PGPASSWORD: luno_ci_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: yarn.lock

      - run: yarn install --frozen-lockfile
      - run: yarn lint:ci
      - run: yarn test
      - run: yarn build
